source /boot/grub/config.cfg

# Kernel parameters beyond Debian live's "boot=live components quiet":
#   toram=filesystem.squashfs
#                        copy the system image into RAM, so the USB drive can
#                        be removed after boot and no USB storage traffic
#                        shares the host controller with the mouse
#   loglevel=3           keep kernel warnings from printing over the menu
#   locales=C.UTF-8      a locale that needs no locale data installed
#   nox11autologin       live-config: don't start X at login
#   nomodeset            no GPU driver: X draws on the firmware framebuffer,
#   video=efifb:auto     which the kernel's EFI stub first switches to the
#                        firmware's highest resolution (usually native) mode
#   nowatchdog           no per-CPU lockup-detector timers and NMIs
#   rcu_nocbs=all        run RCU callbacks in kernel threads, not in softirq
#                        on whichever core handles the mouse's interrupts
#   irqaffinity=0        device interrupts on core 0 by default;
#                        mouseplotter-tune moves the USB controllers' to the
#                        fastest other cores
#   usbcore.autosuspend  never runtime-suspend USB devices
#   pcie_aspm.policy     no PCIe link power states (e.g. on the xHCI link)
#   cpufreq.default_...  performance governor from the moment a cpufreq
#                        driver loads, including modular ones
menuentry "MousePlotter Live" {
	linux	@KERNEL_LIVE@ boot=live components quiet toram=filesystem.squashfs loglevel=3 locales=C.UTF-8 nox11autologin nomodeset video=efifb:auto nowatchdog rcu_nocbs=all irqaffinity=0 usbcore.autosuspend=-1 pcie_aspm.policy=performance cpufreq.default_governor=performance
	initrd	@INITRD_LIVE@
}
