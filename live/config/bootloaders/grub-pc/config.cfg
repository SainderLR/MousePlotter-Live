set default=0
set timeout=2

# Leave the video mode alone on UEFI (live-build's default config switches to
# 800x600, which X would then be stuck with); the kernel picks it instead. On
# BIOS, ask for a VESA mode, since VGA text mode has no framebuffer at all.
if [ "${grub_platform}" = "pc" ]; then
	insmod all_video
	set gfxpayload=auto
fi
terminal_output console
